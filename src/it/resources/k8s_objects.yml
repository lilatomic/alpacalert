apiVersion: v1
kind: Namespace
metadata:
  name: aa-cronjob
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello
  namespace: aa-cronjob
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox:1.28
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - date; echo Hello from the Kubernetes cluster
          restartPolicy: OnFailure
---
apiVersion: v1
kind: Namespace
metadata:
  name: aa-pods
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-pending
  namespace: aa-pods
  labels:
    app: my-app
spec:
  containers:
  - name: my-container
    image: nginx:1.0.999 # hopefully an invalid tag
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-failed
  namespace: aa-pods
spec:
  restartPolicy: Never
  containers:
  - name: failed-container
    image: busybox:latest
    command: ["sh", "-c", "exit 1"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-example
  namespace: aa-pods
data:
  key0: "value0"
  key1: "value1"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-example
  namespace: aa-pods

---
apiVersion: v1
kind: Pod
metadata:
  name: pod-volumes
  namespace: aa-pods
spec:
  automountServiceAccountToken: false
  volumes:
  - name: configmap-optional
    configMap:
      name: configmap-example
      optional: true
  - name: configmap
    configMap:
      name: configmap-example
      optional: false
  - name: secret-optional
    secret:
      secretName: secret-example
      optional: true
  - name: secret
    secret:
      secretName: secret-example
      optional: false
  containers:
    - name: test
      volumeMounts:
      - name: configmap-optional
        mountPath: /configmap-optional
      - name: configmap
        subPath: key0
        mountPath: /configmap
      - name: secret-optional
        mountPath: /secret-optional
      - name: secret
        subPath: key0
        mountPath: /secret
      image: busybox:latest
      command: ["sh", "-c", "ls /configmap-optional; ls /configmap; ls /secret-optional; ls /secret"]